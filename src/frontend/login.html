<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Biblioteca AcademiaAds</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
    <div class="bg-indigo-600 p-6 text-center text-white">
      <h1 class="text-2xl font-bold tracking-wide">AcademiaAds</h1>
      <p class="text-indigo-100 text-sm mt-1">Sistema de Gestión de Biblioteca (MariaDB + JS)</p>
    </div>

    <form id="formLogin" class="p-6 space-y-5">
      <div id="alertaError" class="hidden bg-red-50 border border-red-300 text-red-700 px-4 py-3 rounded-lg text-sm"></div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Correo Electrónico</label>
        <input
          type="email"
          id="correo"
          required
          value="admin@academiaads.com"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Contraseña</label>
        <input
          type="password"
          id="password"
          required
          value="123456"
          class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md"
      >
        Ingresar al Sistema
      </button>
    </form>
  </div>

  <script>
    if (localStorage.getItem('token_academiaads')) {
      window.location.href = '/index.html';
    }

    const formLogin = document.getElementById('formLogin');
    const alertaError = document.getElementById('alertaError');

    formLogin.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      alertaError.classList.add('hidden');

      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value;

      try {
        const respuesta = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, password })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          alertaError.textContent = datos.error || 'Error al iniciar sesión';
          alertaError.classList.remove('hidden');
          return;
        }

        localStorage.setItem('token_academiaads', datos.token);
        localStorage.setItem('usuario_academiaads', JSON.stringify(datos.usuario));
        window.location.href = '/index.html';
      } catch (error) {
        alertaError.textContent = 'No se pudo conectar con el servidor.';
        alertaError.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
